name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require a version tag matching version.txt
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = Path("version.txt").read_text().strip()
          if os.environ["RELEASE_REF_TYPE"] != "tag" or not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit("Run this workflow on a stable version tag such as v1.0.14.")
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} must match version.txt (v{version}).")
          PY

  tests:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Windows x64 executable
    needs: tests
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install 'torch>=2.0.0' --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt 'pyinstaller==6.16.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Build executable using the Windows spec
        run: python -m PyInstaller --noconfirm --clean SegmentationApp-Windows.spec
      - name: Package executable and calculate SHA-256
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if (!(Test-Path dist/SegmentationApp.exe -PathType Leaf)) {
            throw "PyInstaller did not produce dist/SegmentationApp.exe"
          }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $archive = "release-assets/SegmentationApp-$env:RELEASE_TAG-windows-x64.zip"
          python -m zipfile -c $archive dist/SegmentationApp.exe version.txt LICENSE.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Create release with Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS.txt \
            --verify-tag --generate-notes --title "SegmentationApp $RELEASE_TAG"
